<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Template - @jaoriche</title>
    <!-- นำเข้าฟอนต์น่ารัก Kanit จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* สไตล์รวมและลายพื้นหลังแนวตั้งโทนชมพู */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #ffd6e7;
            /* สร้างลายเส้นแนวตั้งแบบในรูป */
            background-image: repeating-linear-gradient(
                90deg,
                #ffd6e7,
                #ffd6e7 15px,
                #ffcae2 15px,
                #ffcae2 30px
            );
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* คอนเทนเนอร์หลัก */
        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* 1. ชื่อร้าน / หัวข้อเครดิตด้านบน */
        .header-title {
            font-size: 24px;
            font-weight: 600;
            color: #4a3838;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        /* 2. กรอบสำหรับใส่รูปภาพ (แยกเทมเพลต) */
        .image-template-box {
            width: 100%;
            height: 220px;
            background-color: #ffffff;
            border: 4px solid #4a3838;
            border-radius: 28px;
            box-shadow: inset 0 0 0 4px #ff8cb6; /* เส้นขอบด้านในสีชมพูสด */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .image-template-box p {
            color: #b58d99;
            font-size: 20px;
            font-weight: 500;
        }

        /* ซ่อน input file ไว้เปิดใช้งานเมื่อคลิกกรอบรูป */
        .image-template-box input[type="file"] {
            display: none;
        }

        .image-template-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 3. การ์ดรายละเอียด + ช่องให้คะแนน */
        .details-card {
            width: 100%;
            background-color: #ffffff;
            border-radius: 25px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* ข้อความรายละเอียด */
        .card-text-header {
            font-size: 18px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 4px;
        }

        .card-subtext {
            font-size: 13px;
            color: #7a6b6e;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        /* เส้นประคั่นกลาง */
        .dashed-divider {
            border: none;
            border-top: 2px dashed #f0c2d4;
            margin: 10px 0 18px 0;
        }

        /* กล่องให้คะแนนดาวทรงแคปซูลสีชมพูอ่อน */
        .rating-box {
            background-color: #ffe8f2;
            border-radius: 35px;
            padding: 15px 10px 18px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .rating-title {
            font-size: 13px;
            color: #665257;
            font-weight: 400;
        }

        /* ส่วนดาวคะแนน */
        .stars-container {
            display: flex;
            gap: 6px;
            margin: 4px 0;
        }

        .star {
            font-size: 32px;
            color: #ffffff;
            -webkit-text-stroke: 1.5px #ff94ba; /* เส้นขอบดาวสีชมพู */
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            user-select: none;
        }

        .star:hover, .star.active {
            color: #ff94ba; /* เมื่อกดหรือโฮเวอร์เปลี่ยนเป็นดาวสีชมพูเต็ม */
        }

        /* ปุ่ม click here */
        .btn-click-here {
            background-color: #4a3e3e;
            color: #ffffff;
            border: none;
            padding: 8px 50px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 4px;
        }

        .btn-click-here:hover {
            background-color: #332a2a;
        }

        .btn-click-here:active {
            transform: scale(0.98);
        }

        /* 4. แถบสรุปการรีวิวด้านล่าง */
        .footer-summary {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            padding: 0 5px;
        }

        .footer-left {
            font-size: 13px;
            color: #4a3e3e;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .review-badge {
            background-color: #ffb8d2;
            color: #ffffff;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. ช่องชื่อร้าน / เครดิต -->
        <div class="header-title">
            ♥ Credit @jaoriche 🎀
        </div>

        <!-- 2. เทมเพลตช่องใส่รูปภาพ (คลิกเพื่ออัปโหลดรูปภาพได้) -->
        <div class="image-template-box" onclick="document.getElementById('fileInput').click()">
            <p id="placeholderText">สำหรับใส่รูปภาพ</p>
            <img id="previewImage" src="" alt="Preview" style="display: none;">
            <input type="file" id="fileInput" accept="image/*" onchange="previewFile(event)">
        </div>

        <!-- 3. การ์ดใส่รายละเอียด + ช่องให้คะแนนดาว (เทมเพลตแยกจากช่องรูป) -->
        <div class="details-card">
            <div class="card-text-header">
                . ☪ . @jaoriche愛 ♡˙˳⁞˳˙ゝ: ɞ
            </div>
            
            <p class="card-subtext">
                ⚔️ เค้าเกรงใจคนน่ารักกดน้อง 🌸 ด้านล่าง 🖤<br>
                🎀 เพื่อรีวิวการใช้บริการของร้านเจ้าเลิฟสตูดิโอ ♡
            </p>

            <hr class="dashed-divider">

            <!-- ส่วนช่องให้คะแนนดาว -->
            <div class="rating-box">
                <span class="rating-title">เลือกคะแนนการบริการจาก 1 ถึง 5</span>
                
                <div class="stars-container" id="starsContainer">
                    <span class="star" onclick="setRating(1)">★</span>
                    <span class="star" onclick="setRating(2)">★</span>
                    <span class="star" onclick="setRating(3)">★</span>
                    <span class="star" onclick="setRating(4)">★</span>
                    <span class="star" onclick="setRating(5)">★</span>
                </div>

                <button class="btn-click-here" onclick="submitReview()">click here</button>
            </div>
        </div>

        <!-- 4. แถบแสดงจำนวนรีวิวด้านล่าง -->
        <div class="footer-summary">
            <div class="footer-left">
                💬 รีวิวการใช้บริการจากลูกค้าทั้งหมด
            </div>
            <div class="review-badge">
                🖤 จำนวนรีวิว : <span id="reviewCount">0</span> คน 🎀
            </div>
        </div>

    </div>

    <!-- สคริปต์การทำงาน Interaction -->
    <script>
        let selectedRating = 0;
        let totalReviews = 0;

        // ระบบพรีวิวรูปภาพเมื่อผู้ใช้อัปโหลด
        function previewFile(event) {
            const input = event.target;
            const preview = document.getElementById('previewImage');
            const placeholder = document.getElementById('placeholderText');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // ระบบเลือกคะแนนดาว
        function setRating(rating) {
            selectedRating = rating;
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        // การกดปุ่ม click here
        function submitReview() {
            if (selectedRating === 0) {
                alert('กรุณาเลือกดาวเพื่อให้คะแนนก่อนนะคะ ✨');
                return;
            }

            totalReviews++;
            document.getElementById('reviewCount').innerText = totalReviews;
            alert(`ขอบคุณสำหรับการให้คะแนน ${selectedRating} ดาวค่ะ! 💕`);
            
            // รีเซ็ตดาวหลังส่งรีวิว
            setRating(0);
        }
    </script>
</body>
                  </html>
